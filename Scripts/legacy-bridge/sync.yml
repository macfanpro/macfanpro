name: Sync legacy releases
run-name: Legacy sync ${{ inputs.request_id || github.run_id }}
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      request_id:
        type: string
        required: false
      source:
        type: string
        default: macfancontrol/macfancontrol
permissions:
  contents: write
concurrency:
  group: legacy-releases
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Copy and verify published releases
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source || 'macfancontrol/macfancontrol' }}
        run: python3 sync.py --source "$SOURCE"
      - name: Keep the compatibility schedule active
        run: |
          date -u +%Y-%m > .last-successful-sync-month
          git add .last-successful-sync-month
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Record successful compatibility synchronization'
            git push
          fi
