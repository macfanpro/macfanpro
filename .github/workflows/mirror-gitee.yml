name: Mirror to Gitee

on:
  push:
    branches: ["**"]
    tags: ["**"]
  delete:
  release:
    types: [published, edited, deleted, unpublished]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to retry (leave empty for all releases)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: gitee-mirror
  # Keep release events queued when several pushes arrive during an upload.
  queue: max
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'macfancontrol/macfancontrol'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Run trusted maintenance code even when a topic branch/tag triggers it.
          ref: main
          persist-credentials: false
      - name: Mirror refs and published releases
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          MIRROR_TAG: ${{ inputs.tag }}
        run: python3 Scripts/mirror-gitee.py --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" --tag "$MIRROR_TAG"
